[workspace]
resolver = "2"
members = [
  "crates/*",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT"
authors = ["Arief Fajri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-notification = "2"
# opencode.db cleanup. `bundled` compiles SQLite from source so there is
# no system-library dependency; statements are always fixed constants.
rusqlite = { version = "0.32", features = ["bundled"] }
# `getrusage` for the memory numbers in the app log (see src-tauri/src/metrics.rs).
# Already in the lockfile via tauri; declared here so the measurement is not
# hand-rolled FFI.
libc = "0.2"

devclean-core = { path = "crates/core" }
devclean-providers = { path = "crates/providers" }
devclean-scanner = { path = "crates/scanner" }
devclean-cleanup = { path = "crates/cleanup" }

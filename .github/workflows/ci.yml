name: ci

on:
  push:
  pull_request:

# Two pushes in a row would otherwise run two full sweeps of a suite that
# compiles a Tauri app twice. The older run is cancelled rather than raced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, lints and tests on BOTH runners.
  #
  # macOS is the shipped platform. Ubuntu exists because the platform-specific
  # code — `st_blocks` sizing, `statvfs`, `rusage`, the Trash implementation —
  # is Unix-shaped and was previously only ever compiled on one OS. The Linux
  # branch of `metrics::peak` had no coverage at all before this.
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The runner is pinned, not `ubuntu-latest`. The apt package names
        # differ between Ubuntu releases (`libwebkit2gtk-4.1-dev` here,
        # `-4.0-dev` on 22.04), so an unpinned runner can break the build with
        # no code change — the same reason the Rust toolchain is pinned.
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned by rust-toolchain.toml, not "stable": a cleanup tool that
          # suddenly stops building because of an unrelated compiler release is
          # worse than one a version behind.
          toolchain: "1.90"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Tauri's Linux stack needs these. `glib-sys`, `gobject-sys`, `gtk-sys`,
      # `soup3-sys`, `webkit2gtk-sys` and `libappindicator-sys` all resolve
      # their libraries through pkg-config at build time. `libappindicator` is
      # pulled by the `tray-icon` feature; there is no `openssl-sys` in the
      # lock, so no libssl-dev.
      - name: Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            patchelf

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run check
        working-directory: apps/desktop
      # Without this, the guardrails that live in test files — G-UI-02/03/05
      # (pages never call the cleanup API, tray menu allowlist, pointer rule)
      # and G-PUB-01/G-PUB-04 (platform claims match CI, screenshots come from
      # the fixture) — are only enforced by whoever remembers to run them.
      - run: npm test
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop

# There is deliberately no separate `msrv` job. Every job pins 1.90 through
# `rust-toolchain.toml`, so `cargo test --workspace` above already proves the
# declared `rust-version` compiles; a second job at the same version would run
# the identical command on the identical code.

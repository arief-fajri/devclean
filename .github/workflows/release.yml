name: release

# Manual on purpose. For a tool that deletes files, every tag is a support
# statement — it should be a decision, not a side effect of a merge. The tag is
# created first (and reviewed as a commit), then this workflow attaches
# artifacts to it. It never creates the tag itself, so nothing is released that
# nobody looked at.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.1.0)"
        required: true
        type: string
      draft:
        description: "Create the release as a draft"
        required: false
        type: boolean
        default: true

permissions:
  contents: write # required to create the release; the default is read

jobs:
  # Do not trust that main was green. The tag is what ships, so verify the tag.
  verify:
    name: verify ${{ inputs.tag }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Confirm the tag matches the declared versions
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          CARGO=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAURI=$(python3 -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          echo "tag=$TAG cargo=$CARGO tauri=$TAURI"
          if [ "v$CARGO" != "$TAG" ] || [ "$CARGO" != "$TAURI" ]; then
            echo "::error::tag $TAG does not match Cargo.toml ($CARGO) / tauri.conf.json ($TAURI)"
            exit 1
          fi

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run check
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop

  build:
    name: build .app + .dmg
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # `cargo tauri build` runs `beforeBuildCommand: npm run build`, so the
      # frontend deps must exist before it starts.
      - run: npm ci
        working-directory: apps/desktop

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign). The private key and its password are
          # repo secrets; the matching public key is committed in
          # tauri.conf.json → plugins.updater.pubkey. If these are missing the
          # build fails on purpose — an unsigned release must not ship, because
          # every installed copy would then refuse it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # No Apple signing identity or notarization credentials are
          # configured, so the .app is unsigned by design. That does not stop
          # in-app updates: the updater's minisign signature is a separate
          # chain, and the swapped bundle is written by the app process, so no
          # quarantine is applied. The README documents the one-time Gatekeeper
          # step a first install needs.
          projectPath: apps/desktop
          # createUpdaterArtifacts is turned on HERE, not in tauri.conf.json:
          # that keeps a local `cargo tauri build` working without the signing
          # key, while a release build always signs its updater artifacts.
          args: --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'
          # Packaging a .dmg on CI is the flakiest step in this pipeline, and a
          # failure costs the whole ~10 minute build. The action retries the
          # build (and the upload) rather than the job.
          retryAttempts: 2

      # Stage first, checksum second. The checksum file must describe exactly
      # what is uploaded: an earlier version hashed everything under `bundle/`
      # — including the `.app.tar.gz` the action creates — while staging copied
      # only the `.dmg` and a separate `ditto` zip. The result listed a file
      # that was not in the release and omitted one that was.
      - name: Stage artifacts
        run: |
          set -euo pipefail
          # The bundle lands in the Cargo workspace's target dir, which is the
          # repo root because `apps/desktop/src-tauri` is a workspace member.
          # Fall back to the crate-local path in case that ever stops being
          # true, and fail loudly rather than publish an empty release.
          BUNDLE=target/release/bundle
          test -d "$BUNDLE" || BUNDLE=apps/desktop/src-tauri/target/release/bundle
          test -d "$BUNDLE" || { echo "no bundle directory found"; exit 1; }
          mkdir -p dist-artifacts

          cp "$BUNDLE"/dmg/*.dmg dist-artifacts/
          # The action has already packaged the .app as a .tar.gz; reuse it
          # rather than making a second archive of the same thing.
          cp "$BUNDLE"/macos/*.app.tar.gz dist-artifacts/
          # The updater signature produced by createUpdaterArtifacts. It must
          # travel with the tarball — latest.json quotes it verbatim, and the
          # app verifies the tarball against it before installing.
          cp "$BUNDLE"/macos/*.app.tar.gz.sig dist-artifacts/

          ls -la dist-artifacts

      # The manifest the in-app updater polls
      # (tauri.conf.json → plugins.updater.endpoints). Generated here rather
      # than by the action so the release stays created by the `publish` job:
      # tauri-action's own `includeUpdaterJson` would attach it to a release
      # the action made, which this workflow deliberately never does.
      - name: Build the updater manifest (latest.json)
        working-directory: dist-artifacts
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TARBALL=$(ls *.app.tar.gz)
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # Point at THIS tag's asset, not `latest`, so the manifest and the
          # binary it describes can never drift apart.
          URL="https://github.com/${REPO}/releases/download/${TAG}/${TARBALL}"
          python3 - "$VERSION" "$PUB_DATE" "$URL" "$(cat "$TARBALL.sig")" > latest.json <<'PY'
          import json, sys

          version, pub_date, url, signature = sys.argv[1:5]
          print(
              json.dumps(
                  {
                      "version": version,
                      "pub_date": pub_date,
                      # arm64 only: the release builds on macos-latest, which is
                      # Apple Silicon. An Intel build would add "darwin-x86_64".
                      "platforms": {
                          "darwin-aarch64": {"signature": signature, "url": url}
                      },
                  },
                  indent=2,
              )
          )
          PY
          cat latest.json

      - name: Checksums over exactly what is uploaded
        working-directory: dist-artifacts
        run: |
          set -euo pipefail
          # Everything staged, except the checksum file being written — `*`
          # would match it on a re-run and hash the file into itself. This is
          # the same set `upload-artifact` sends, so the two cannot drift.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > SHA256SUMS
          cat SHA256SUMS
          # A checksum file listing fewer than two artifacts means staging
          # produced nothing, which must fail loudly rather than publish an
          # empty release.
          test "$(wc -l < SHA256SUMS)" -ge 2

      - uses: actions/upload-artifact@v4
        with:
          name: devclean-${{ inputs.tag }}
          path: dist-artifacts/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: devclean-${{ inputs.tag }}
          path: dist-artifacts

      # gh is preinstalled on GitHub runners, so no third-party release action
      # is needed. --verify-tag refuses to create a release for a tag that does
      # not exist, which is the whole point of the manual flow.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(--verify-tag --title "${{ inputs.tag }}" --generate-notes)
          if [ "${{ inputs.draft }}" = "true" ]; then ARGS+=(--draft); fi
          gh release create "${{ inputs.tag }}" "${ARGS[@]}" dist-artifacts/*
